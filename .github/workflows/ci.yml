name: CI

on:
  push:
    branches: [main, autopilot]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test

  ci-ok:
    name: ci-ok
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix job to pass
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Matrix result: ${{ needs.test.result }}"
            exit 1
          fi
