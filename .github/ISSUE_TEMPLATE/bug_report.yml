name: Bug report
description: Something does not work as documented.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not paste API keys, prompts, captured traffic or
        personal data. Redact logs before attaching them.
  - type: input
    id: version
    attributes:
      label: Version
      description: npm version or commit SHA.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Upstream mode
      options:
        - local (Ollama daemon)
        - cloud (ollama.com)
        - not sure
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11, macOS 15, Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: "v22.14.0"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client
      description: Which client, version, and how it is configured.
      placeholder: "Claude Code 2.x, Cline, curl, ..."
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the gateway with ...
        2. Send ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact secrets, prompts and personal data. Metadata-only usage log lines are usually enough.
      render: text
