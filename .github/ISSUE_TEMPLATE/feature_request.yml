name: Feature request
description: Propose a capability or an improvement.
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what blocks you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you want. Configuration shape and HTTP examples help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds, other tools, or a different design.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - admin panel
        - configuration
        - upstream adapter
        - security
        - documentation
        - packaging and deployment
        - other
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      description: The core keeps these constraints unless a maintainer agrees otherwise.
      options:
        - label: No runtime dependencies
          required: false
        - label: Local-first and loopback by default
          required: false
        - label: Privacy-preserving defaults
          required: false
